      // Aplica o tema antes da primeira pintura para evitar o "flash" claro.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('forum_ifsp_theme_v1') || '"system"');
          var dark = stored === 'dark' || (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
